name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: fullstack_integration_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app -d fullstack_integration_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379/0
      TEST_REDIS_URL: redis://127.0.0.1:6379/14
      E2E_REDIS_URL: redis://127.0.0.1:6379/15
      DATABASE_URL: postgresql://app:app@127.0.0.1:5432/fullstack_dev
      TEST_DATABASE_URL: postgresql://app:app@127.0.0.1:5432/fullstack_integration_test
      E2E_DATABASE_URL: postgresql://app:app@127.0.0.1:5432/fullstack_e2e_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: fullstack_e2e_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app -d fullstack_e2e_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379/0
      TEST_REDIS_URL: redis://127.0.0.1:6379/14
      E2E_REDIS_URL: redis://127.0.0.1:6379/15
      DATABASE_URL: postgresql://app:app@127.0.0.1:5432/fullstack_dev
      TEST_DATABASE_URL: postgresql://app:app@127.0.0.1:5432/fullstack_integration_test
      E2E_DATABASE_URL: postgresql://app:app@127.0.0.1:5432/fullstack_e2e_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:chromium
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
